version: "3.8"
services:
  anh-decision-bot:
    build: .
    restart: unless-stopped
    env_file:
      - ${ANNEX_CONFIG}/anh-decision-bot.env
    environment:
      PYTHONPATH: /mnt/nas-venv/lib/python3.11/site-packages
    labels:
      - "com.anh.owner=dinesh"
      - "com.anh.service=anh-decision-bot"
      - "com.anh phase=2a"
    networks:
      - anh_internal
networks:
  anh_internal:
    external: true
    name: anh_internal
