version: "3.8"

services:
  anh-decision-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: anh-decision-bot:latest
    container_name: anh-decision-bot
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Australia/Sydney}
      - DECISION_BOT_TOKEN=${DE_TOKEN}
      - DECISION_BOT_ALLOWED_USER_ID=${DECISION_BOT_ALLOWED_USER_ID}
      - DECISION_PG_HOST=${DECISION_PG_HOST:-10.87.1.14}
      - DECISION_PG_PORT=${DECISION_PG_PORT:-5432}
      - DECISION_PG_DATABASE=${DECISION_PG_DATABASE:-anh_decisions}
      - DECISION_PG_USER=${DECISION_PG_USER:-postgres}
      - DECISION_PG_PASS=${DECISION_PG_PASS}
    volumes:
      - ./bot.py:/app/bot.py:ro
    networks:
      - homelab-backend

  anh-decision-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: anh-decision-api:latest
    container_name: anh-decision-api
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Australia/Sydney}
      - DECISION_PG_HOST=${DECISION_PG_HOST:-10.87.1.14}
      - DECISION_PG_PORT=${DECISION_PG_PORT:-5432}
      - DECISION_PG_DATABASE=${DECISION_PG_DATABASE:-anh_decisions}
      - DECISION_PG_USER=${DECISION_PG_USER:-postgres}
      - DECISION_PG_PASS=${DECISION_PG_PASS}
    ports:
      - "8000:8000"
    networks:
      - homelab-backend

networks:
  homelab-backend:
    external: true
    name: homelab-backend
